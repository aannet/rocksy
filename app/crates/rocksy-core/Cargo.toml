[package]
name = "rocksy-core"
description = "UI-independent core of Rocksy: files, vault registry, tree snapshot, tag index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "rocksy_core"
path = "src/lib.rs"

[[bin]]
name = "rocksy-cli"
path = "src/bin/rocksy-cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
notify = "9.0.0"
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
