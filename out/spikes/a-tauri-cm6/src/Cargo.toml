[workspace]
resolver = "2"
members = ["crates/rocksy-core"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "UNLICENSED"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
# "unwind": a panic in a background thread (tantivy on a damaged index) must
# not kill the process and the unsaved text with it; it is caught and turned
# into an error (see search/engine.rs).
panic = "unwind"
