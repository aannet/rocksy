[package]
name = "rocksy"
version = "0.1.1"
edition = "2021"
description = "Rocksy - fast Markdown notes app"
license = "UNLICENSED"

# Kept out of the parent workspace for now: the core crate must stay buildable
# and testable on Linux without the Tauri dependency tree.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rocksy-core = { path = "../crates/rocksy-core" }

[features]
# Embeds ui/dist in the binary (always on for real builds).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
